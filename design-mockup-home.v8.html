  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  body{
    background:#050608;display:flex;justify-content:center;align-items:center;
    min-height:100vh;font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    padding:24px;color:var(--paper);
  }

  .phone{
    width:390px;height:844px;border-radius:48px;background:var(--ink);   /* 平涂，不留装饰光 */
    position:relative;overflow:hidden;isolation:isolate;
    border:1px solid rgba(237,228,211,0.10);
    box-shadow:0 50px 130px rgba(0,0,0,0.65), inset 0 0 0 2px rgba(0,0,0,0.5);
  }
  /* 注：屏幕级暗角已删除。纸是白的，任何屏幕级 inset 阴影都会把纸的四边压成"脏纸"。
     暗角改由 .keep::after 承担 —— 它只属于暗房。 */
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:30px;background:#000;border-radius:18px;z-index:8;opacity:0.85;}

  /* ══ 上半屏：生宣。满出血、无圆角、无投影 —— 它是"屏幕的上半部分"，不是一个物件 ══ */
  .sheet{
    position:absolute;left:0;right:0;top:0;height:566px;z-index:3;
    background-color:#F2EBDD;
    background-image:var(--papertex);background-size:cover;background-position:center 20%;
    padding:48px 24px 34px;display:flex;flex-direction:column;
    -webkit-mask-image:var(--deckle);        mask-image:var(--deckle);
    -webkit-mask-size:100% 100%;             mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat;           mask-repeat:no-repeat;
  }
  /* 注：不再叠第二层纤维 —— 与底图同纹理、比例不同会产生摩尔干涉（可见方块色块）。
     底图 background-image 本身已经是真纤维，够了。 */

  .statusbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;letter-spacing:0.5px;color:var(--ink-on-paper);flex:0 0 auto;position:relative;z-index:1;}
  .statusbar .right{display:flex;gap:6px;align-items:center;color:var(--ink-on-paper);}
  .statusbar .right svg{display:block;}

  /* 印章：这一次是真的盖在纸上 */
  .header{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex:0 0 auto;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:12px;}
  .seal{
    width:38px;height:38px;flex:0 0 38px;color:var(--seal-paper);position:relative;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif SC',serif;font-weight:900;font-size:24px;line-height:1;
    transform:rotate(-2deg);
  }
  .seal::before{
    content:'';position:absolute;inset:0;z-index:0;background:var(--seal);
    border-radius:2px 3px 1px 3px;
    outline:1px solid rgba(245,237,224,0.85);outline-offset:-6px;
    filter:url(#inkBleed);
  }
  .seal span{position:relative;z-index:1;}
  .brand .name{font-family:'Noto Serif SC',serif;font-weight:600;font-size:15px;letter-spacing:2.5px;color:rgba(42,33,28,0.78);}
  .menu-btn{width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:4px;align-items:flex-end;margin-right:-4px;}
  .menu-btn span{display:block;height:1.5px;width:18px;background:rgba(42,33,28,0.82);border-radius:2px;}

  /* 题字：写在纸上 */
  .inscription{
    margin-top:18px;flex:0 0 auto;position:relative;z-index:1;
    font-family:'Noto Serif SC',serif;font-weight:600;font-size:21px;line-height:1.3;
    color:var(--ink-on-paper);letter-spacing:0.5px;
  }
  .inscription em{
    font-family:'Ma Shan Zheng',serif;font-style:normal;
    font-size:1.1em;color:var(--seal);vertical-align:-0.03em;
  }

  /* 录音键 = 一滴生墨（黑）。渗进纸的墨**不投影** —— 这一点决定它是不是"贴纸" */
  .stamp-zone{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding-bottom:2px;}
  /* 墨滴：一层近乎平的浓色，**不做假高光** —— 浓淡全交给真墨迹蒙版。
     一旦给它一个受光面，它就从"渗进纸的墨"变成"摆在纸上的球"。 */
  .ink-drop{
    position:absolute;inset:0;margin:auto;width:150px;height:150px;z-index:2;
    background:radial-gradient(circle closest-side at 50% 50%, #0A0908 0%, #100E0C 58%, #1E1A17 100%);
    -webkit-mask-image:var(--inkmask);        mask-image:var(--inkmask);
    -webkit-mask-size:contain;                mask-size:contain;
    -webkit-mask-position:center;             mask-position:center;
    -webkit-mask-repeat:no-repeat;            mask-repeat:no-repeat;
    transition:transform 240ms cubic-bezier(.2,.8,.2,1), background 240ms ease-out;
  }
  /* 渗晕①（最外、极淡）：纸被浸湿的那点潮意。有它才是"墨进了纸"，没它就是"贴了个黑片"。
     但它必须**远大于核、且极淡**，一旦又近又浓就变成核外的一圈灰环 -> 整屏读作失焦。 */
  /* ⚠ 这里必须写 `closest-side`。`radial-gradient(circle,…)` 默认是 farthest-corner，
     100% 落在 0.707×框的对角处 —— 而墨迹蒙版在约 63% 就把元素裁掉了，
     于是 transparent 92%/100% 这些停止点**永远执行不到**，渐变被蒙版在还有 0.3
     透明度的位置硬切一刀 —— 那一刀就是核外那圈"暗环"、就是整屏发糊的元凶。
     改用 closest-side，并让 alpha 在蒙版裁切线（89%）**之前**归零。 */
  .bleed{
    position:absolute;inset:0;margin:auto;z-index:0;width:252px;height:252px;
    pointer-events:none;filter:blur(15px);
    background:radial-gradient(circle closest-side, rgba(42,33,28,0.10) 0 40%, rgba(42,33,28,0.04) 62%, transparent 78%);
    -webkit-mask-image:var(--inkmask);        mask-image:var(--inkmask);
    -webkit-mask-size:contain;                mask-size:contain;
    -webkit-mask-position:center;             mask-position:center;
    -webkit-mask-repeat:no-repeat;            mask-repeat:no-repeat;
  }
  /* 渗晕②（紧贴核的细水痕圈）：墨在纤维里停住时留下的那一道窄边。
     它只比核大 8%，而核是不透明且压在它上面（z-index 2 > 1），
     所以外露的部分正好是**一圈细环**，不是一片灰雾。按下时向外扩一圈 = "渗开"。 */
  .wet-ring{
    position:absolute;inset:0;margin:auto;z-index:1;width:172px;height:172px;
    pointer-events:none;filter:blur(3.5px);
    background:radial-gradient(circle closest-side, rgba(30,24,20,0.30) 0 48%, rgba(30,24,20,0.10) 68%, transparent 82%);
    -webkit-mask-image:var(--inkmask);        mask-image:var(--inkmask);
    -webkit-mask-size:contain;                mask-size:contain;
    -webkit-mask-position:center;             mask-position:center;
    -webkit-mask-repeat:no-repeat;            mask-repeat:no-repeat;
    transition:transform 260ms ease-out, opacity 260ms ease-out;
  }
  /* 按下：墨被压开 + 洇痕向外扩一圈（不是"点亮一颗球"） */
  .ink-drop:active{transform:scale(.92);}
  .ink-drop:active ~ .wet-ring{transform:scale(1.09);opacity:1;}
  /* 录音态：墨**变湿变亮**（同一色相内提亮），不换色 —— 朱是印章的，墨永远是墨。
     状态变化由"持续渗开"承担，不靠发光：全稿零发光。 */
  .phone.recording .ink-drop{
    background:radial-gradient(circle closest-side at 50% 50%, #14120F 0%, #1D1A17 58%, #35302A 100%);
  }
  .phone.recording .wet-ring{animation:seep 2.6s ease-out infinite;}
  @keyframes seep{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.17);opacity:0}}
  .hint{text-align:center;position:relative;z-index:1;margin-top:6px;}
  .hint .h1{font-size:15px;font-weight:500;color:var(--ink-on-paper);letter-spacing:0.5px;}
  .hint .h2{font-size:11.5px;color:var(--ink-on-paper-dim);margin-top:3px;letter-spacing:0.3px;}

  /* ══ 下半屏：暗房（已显影的底片）。颗粒只属于这里 ══ */
  .keep{position:absolute;left:0;right:0;top:566px;bottom:0;z-index:3;padding:22px 24px 0;background:var(--ink);}
  .keep::after{                        /* 暗房的镜头暗角。只在这里，不越界到纸上 */
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 62% at 50% 42%, transparent 48%, rgba(0,0,0,0.34) 100%);
  }
  .film-grain{
    position:absolute;inset:0;pointer-events:none;
    mix-blend-mode:overlay;opacity:0.5;
    background-image:var(--grain);background-size:240px 240px;background-repeat:repeat;
  }
  .recent{position:relative;z-index:1;}
  .recent .ttl{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;letter-spacing:1px;color:rgba(237,228,211,0.72);
    padding-bottom:7px;border-bottom:1px solid var(--hair);
  }
  .recent .ttl .more{font-size:12px;letter-spacing:0.5px;color:rgba(237,228,211,0.66);}
  .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:12px;}
  .item .left{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .item .name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--paper);letter-spacing:0;}
  .sti{width:14px;height:14px;flex:0 0 14px;display:flex;align-items:center;justify-content:center;}
  .sti i{display:block;width:8px;height:8px;border-radius:50%;background:var(--paper);}  /* 已生成 = 实心墨点 */
  .item .meta{font-size:12px;color:var(--paper-dim);padding-left:22px;letter-spacing:0.3px;}
  .item .right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .item .dur{font-size:13px;color:var(--paper-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .item.rendering .dur,.item.rendering .meta{color:var(--progress);}   /* 处理中=琥珀 */
  .play{width:20px;height:20px;flex:0 0 20px;color:var(--paper-soft);display:flex;align-items:center;justify-content:center;}
  /* 显影：转写中不是静态 82%，是"正在浮现" */
  .pg{stroke-dasharray:34.56;stroke-dashoffset:17;}   /* 停在"半显影"，待机态不动 */

  /* 导航栏：融进暗房，不做浮起的工具条（那是通用深色 App 模板味最重的地方） */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:68px;z-index:5;
    display:flex;justify-content:space-around;align-items:center;
    padding-bottom:env(safe-area-inset-bottom,0);
    border-top:1px solid rgba(237,228,211,0.08);
    background:transparent;
  }
  /* 三个图标也是母题符号：渗开的墨点 / 一道墨痕 / 未显影的涟漪 */
  .tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(237,228,211,0.38);font-size:10px;letter-spacing:1px;}
  .tab.active{color:var(--paper);}
  .tab svg{display:block;}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- color-interpolation-filters="sRGB"：SVG 滤镜默认走 linearRGB，会让色值偏离令牌。
         实测本页印章在加与不加时都是 #8F2C20（无偏离），所以这条只是**预防性**的，
         不是修复。仍保留：任何后续改动造成偏离时它会挡住。 -->
    <filter id="inkBleed" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>

          <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="19" height="11" rx="3" stroke="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor"/><rect x="21" y="3.5" width="2" height="5" rx="1" fill="currentColor"/></svg>
        </div>
      </div>

      <div class="header">
        <div class="brand">
          <div class="seal"><span>记</span></div>
          <div class="name">AI 记忆卡</div>
        </div>
        <div class="menu-btn"><span></span><span></span><span></span></div>

      <div class="inscription">开口，便被<em>记</em>下。</div>

      <div class="stamp-zone">
        <div class="ink-drop"></div>
        <div class="bleed"></div>
        <div class="wet-ring"></div>
      </div>

      <div class="hint">
        <div class="h1">按一下开始录音</div>
        <div class="h2">或长按进入速记</div>
      </div>
    </div>

    <!-- ══ 暗房（已显影的底片）══ -->
    <div class="keep">
      <div class="film-grain"></div>
      <div class="recent">
        <div class="ttl"><span>最近 · 共 128 段</span><span class="more">全部 →</span></div>

        <div class="item">
          <div class="left">
            <div class="name"><span class="sti"><i></i></span>马原小组讨论 · 第三周</div>
            <div class="meta">今天 14:32 · 会议纪要已生成</div>
          </div>
          <div class="right">
            <div class="dur">42:18</div>
            <div class="play"><svg width="10" height="11" viewBox="0 0 10 11"><path d="M1.2 1.2l7.6 4.3-7.6 4.3z" fill="currentColor"/></svg></div>
          </div>
        </div>

        <div class="item rendering">
          <div class="left">
            <div class="name"><span class="sti">
              <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="rgba(216,155,74,0.22)" stroke-width="1.8"/><circle class="pg" cx="7" cy="7" r="5.5" fill="none" stroke="#D89B4A" stroke-width="1.8" transform="rotate(-90 7 7)"/></svg>
            </span>考研英语真题精讲</div>
            <div class="meta">昨天 19:05 · 转写中</div>
          </div>
          <div class="right"><div class="dur">58:40</div></div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab active">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 10.5 11 4l7 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v7.5h11V10" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>

</body>
